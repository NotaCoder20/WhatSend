[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "selWhats_library"
version = "0.1.0"
description = "Automated WhatsApp Web messaging using Selenium (single Chrome session)"
readme = "README.md"

authors = [
  {name = "Kevin Dedhia", email = "kevindedhiawork@gmail.com"}
]
license = {text = "MIT"}
keywords = ["whatsapp", "selenium", "automation", "whatsapp-web"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries",
  "Topic :: Communications"
]
requires-python = ">=3.10"

dependencies = [
  "selenium>=4.0",
  "requests>=2.0",
  "pyperclip>=1.8",
  "pywin32; platform_system == 'Windows'"
]

[project.urls]
"Homepage" = "https://github.com/NotaCoder20/selWhats_library"
"Source" = "https://github.com/NotaCoder20/selWhats_library"
"Issues" = "https://github.com/NotaCoder20/selWhats_library/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["selWhats_library*"]

[tool.setuptools_scm]
write_to = "selWhats_library/_version.py"
